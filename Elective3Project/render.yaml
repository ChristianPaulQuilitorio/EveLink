services:
  - type: web
    name: evelink
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: SUPABASE_SCHEMA
        value: public
      - key: SUPABASE_STORAGE_BUCKET
        value: event-assets
      - key: APP_URL
        fromService:
          type: web
          name: evelink
          property: url
