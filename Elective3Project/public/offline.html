<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EveLink Offline</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f3f6fb;
      font-family: Segoe UI, Tahoma, sans-serif;
      color: #1f2a38;
      padding: 24px;
    }
    .card {
      width: min(100%, 520px);
      border: 1px solid #dbe2ec;
      border-radius: 14px;
      padding: 24px;
      background: #fff;
    }
    h1 { margin: 0 0 8px; }
    p { margin: 0; color: #627084; }
  </style>
</head>
<body>
  <div class="card">
    <h1>You are offline</h1>
    <p>EveLink will reconnect automatically once your internet is back.</p>
  </div>
</body>
</html>
